services:
  - type: web
    name: echelle-eg39-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: "7f3b9c2e5a1d4f8e6b0c3a7d9e2f5b8c1a4d6e9f2b5c8e1a4d7f0b3c6e9f2a5b"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:*,https://echelle-eg39.web.app,https://*.onrender.com"
      # ⚠️ Ces variables sont configurées manuellement dans le Dashboard Render.
      # `sync: false` indique à Render de NE PAS écraser les valeurs existantes.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
